name: CPU tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch (Linux)
        if: runner.os == 'Linux'
        run: python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --upgrade pip 'setuptools>=77'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - name: Build and exercise installed wheel
        shell: bash
        run: |
          python -m build --no-isolation --wheel
          python -m pip uninstall -y realityforge
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/smoke_installed.py"
