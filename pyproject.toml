[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "realityforge"
version = "0.1.0"
readme = "README.md"
description = "Calibrated planar video-to-physics with learned initialization and differentiable refinement"
requires-python = ">=3.11,<3.15"
license = "MIT AND CC-BY-NC-4.0 AND CC-BY-SA-4.0"
license-files = ["LICENSE", "NOTICE.md"]
dependencies = ["torch>=2.6,<3", "numpy>=2,<3", "scipy>=1.14,<2", "opencv-python-headless>=4.10,<5", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20", "pillow>=11,<13"]
[project.urls]
Repository = "https://github.com/nazeeh111/RealityForge"
Documentation = "https://github.com/nazeeh111/RealityForge/tree/main/docs"
Issues = "https://github.com/nazeeh111/RealityForge/issues"

[project.optional-dependencies]
dev = ["setuptools>=77", "pytest>=8,<10", "httpx>=0.28,<1", "build>=1.2,<2", "matplotlib>=3.9,<4"]
[project.scripts]
realityforge = "realityforge.cli:main"
[tool.setuptools]
packages = ["realityforge"]
[tool.pytest.ini_options]
testpaths = ["tests"]
