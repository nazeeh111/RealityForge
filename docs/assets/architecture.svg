<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc"><title id="title">RealityForge architecture</title><desc id="desc">Video tracking, planar coordinates, learned initialization, differentiable physics and forecast validation feed an interactive counterfactual simulation.</desc><rect width="1200" height="320" rx="16" fill="#f3f1eb"/><g font-family="system-ui,sans-serif" fill="#263b35"><text x="32" y="39" font-size="13" letter-spacing="2">AN OBSERVATION BECOMES A TESTABLE MODEL</text></g><g stroke="#c9d2c8" fill="#fffefa"><rect x="32" y="69" width="200" height="122" rx="7"/><rect x="266" y="69" width="200" height="122" rx="7"/><rect x="500" y="69" width="200" height="122" rx="7"/><rect x="734" y="69" width="200" height="122" rx="7"/><rect x="968" y="69" width="200" height="122" rx="7"/></g><g font-family="system-ui,sans-serif"><g fill="#64816c" font-size="11"><text x="49" y="93">01 / OBSERVE</text><text x="283" y="93">02 / COORDINATES</text><text x="517" y="93">03 / INITIALIZE</text><text x="751" y="93">04 / REFINE</text><text x="985" y="93">05 / TEST</text></g><g fill="#263b35" font-size="17" font-weight="600"><text x="49" y="124">Streaming tracking</text><text x="283" y="124">Planar geometry</text><text x="517" y="124">ParameterNet</text><text x="751" y="124">Physical equations</text><text x="985" y="124">Withheld forecast</text></g><g fill="#64766c" font-size="12"><text x="49" y="150">Color / template / foreground</text><text x="49" y="170">Pixels + timestamps</text><text x="283" y="150">Circle or straight path</text><text x="283" y="170">Fit-window observations</text><text x="517" y="150">96 observations + 4 features</text><text x="517" y="170">Synthetic-only training</text><text x="751" y="150">Differentiable trajectory fit</text><text x="751" y="170">Parameters + local intervals</text><text x="985" y="150">Residuals + failure warnings</text><text x="985" y="170">Evidence before editing</text></g></g><g stroke="#7e9484" stroke-width="1.8" fill="none"><path d="M236 130h24m-6-4 6 4-6 4M470 130h24m-6-4 6 4-6 4M704 130h24m-6-4 6 4-6 4M938 130h24m-6-4 6 4-6 4"/><path d="M834 196v39H600m7-4-7 4 7 4"/></g><rect x="300" y="217" width="300" height="66" rx="7" fill="#263b35"/><text x="320" y="244" fill="#f3f1eb" font-family="system-ui,sans-serif" font-size="16">Change conditions. Simulate again.</text><text x="320" y="266" fill="#b9cbbd" font-family="system-ui,sans-serif" font-size="12">Editable parameters → the same physical solver</text><text x="650" y="271" font-family="system-ui,sans-serif" fill="#7b6b5b" font-size="12">No arbitrary 3D inference · no cloud model calls</text></svg>
